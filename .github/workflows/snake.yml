name: Generate contribution snake

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#ff8a3d&color_dots=#ebedf0,#ffd8b5,#ffb070,#ff8a3d,#c2561a
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#ff8a3d&color_dots=#161b22,#4a2a14,#7a3b12,#c2561a,#ff8a3d

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
